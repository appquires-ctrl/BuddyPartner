name: Keep Backend Warm

on:
  schedule:
    # Runs every 14 minutes (Render free tier spins down after 15 min of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger from Actions tab

jobs:
  ping-health:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          TARGET_URL="${{ secrets.RENDER_BACKEND_URL }}"
          if [ -z "$TARGET_URL" ]; then
            echo "⚠️ RENDER_BACKEND_URL secret not set. Skipping ping."
            exit 0
          fi
          echo "Pinging $TARGET_URL/health..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$TARGET_URL/health" || echo "000")
          echo "Response code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Server is warm and healthy."
          else
            echo "⚠️ Ping returned status $HTTP_STATUS"
          fi
